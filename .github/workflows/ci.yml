name: Spring Boot CI Pipeline

on:
  push:
    branches:
      - my-springbot-app
  pull_request:
    branches:
      - my-springbot-app


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code.
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Buidl with Maven
        uses: mvn clean install
